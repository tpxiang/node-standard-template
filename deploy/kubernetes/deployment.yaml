apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-node-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-node-backend
  template:
    metadata:
      labels:
        app: enterprise-node-backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: enterprise-node-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: enterprise-node-backend-config
            - secretRef:
                name: enterprise-node-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 20

