apiVersion: v1
kind: Secret
metadata:
  name: enterprise-node-backend-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_backend?schema=public
  JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
  JWT_REFRESH_SECRET: replace-with-another-32-random-characters
  METRICS_TOKEN: replace-with-a-random-metrics-token
