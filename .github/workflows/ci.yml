name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - mysql

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/enterprise_backend pnpm prisma validate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: docker build -t enterprise-node-backend:ci .

  e2e-postgres:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_backend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma:seed
      - run: pnpm test:e2e:flow
        env:
          RUN_E2E: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_backend_test?schema=public
          DATABASE_PROVIDER: postgresql
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_DB: "1"
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          LOG_LEVEL: silent

  e2e-mysql:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/mysql' || github.base_ref == 'mysql'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: enterprise_backend_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uapp -papp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma:seed
      - run: pnpm test:e2e:flow
        env:
          RUN_E2E: "1"
          DATABASE_URL: mysql://app:app@localhost:3306/enterprise_backend_test
          DATABASE_PROVIDER: mysql
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_DB: "1"
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          LOG_LEVEL: silent
